[metadata]
name = pbik
version = 0.14.0
description = pbip-kit's PBIR / TMDL command line tool (Python standard library; jsonschema optional)

[options]
packages = pbikit
python_requires = >=3.9

[options.extras_require]
schema = jsonschema>=4

[options.entry_points]
console_scripts =
    pbik = pbikit.cli:main
