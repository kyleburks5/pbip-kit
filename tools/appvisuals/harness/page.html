<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pbip-kit visual harness</title>
<style>
  html, body { margin: 0; background: #ffffff; }
  #harness-visual { position: relative; margin: 16px; overflow: hidden; background: #ffffff; }
  #harness-tooltip { position: fixed; display: none; z-index: 10; white-space: pre; font: 12px "Segoe UI", sans-serif;
    background: #ffffff; color: #252423; border: 1px solid #c8c6c4; padding: 6px 8px; pointer-events: none; }
  @media (forced-colors: active) { html, body, #harness-visual { background: #000000; } }
</style>
</head>
<body>
<div id="harness-visual"></div>
<div id="harness-tooltip"></div>
</body>
</html>
